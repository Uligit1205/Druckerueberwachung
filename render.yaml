# Blueprint für render.com (Variante A in der README)
services:
  - type: web
    name: druckerueberwachung
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PASSWORD
        sync: false
      - key: STREAM_TOKEN
        sync: false
